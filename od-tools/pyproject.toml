[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odtools"
authors = [
    { name = "Vojtech Dvorak", email = "dvorak@ufal.mff.cuni.cz" },
]
dependencies = [
    "matplotlib==3.10.0",
    "mung==1.2.1",
    "numpy==2.2.2",
    "opencv_python==4.10.0.84",
    "packaging==24.2",
    "Pillow==11.1.0",
    "prettytable==3.14.0",
    "PyYAML==6.0.2",
    "requests==2.32.3",
    "seaborn==0.13.2",
    "smashcima==1.1.2",
    "tqdm==4.66.1",
    "ultralytics==8.3.28"
]
description = "Object Detection Tools"
readme = "README.md"
requires-python = ">=3.11"
version = "1.0.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/v-dvorak/od-tools"
Source = "https://github.com/v-dvorak/od-tools"
Issues = "https://github.com/v-dvorak/od-tools/issues"

[tool.setuptools.packages.find]
include = ["odtools"]